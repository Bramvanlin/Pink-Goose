<!DOCTYPE html>
<html lang="en">

<head>
    <title>Pink Goose</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Edu+QLD+Hand:wght@400..700&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>

    <section class="section-border">
        <header>
            <div class="header">
                <div>Pink <span id="pink">Goose</span></div>
                <div class="header-buttons-container">
                    <a class="header-button-color" href="index.html" style="text-decoration:none">Home</a>
                    <a class="header-button-color" href="learn.html" style="text-decoration:none">Learn</a>
                    <a class="header-button-color" href="about.html" style="text-decoration:none">About</a>
                    <a class="header-button-color" href="contact.html" style="text-decoration:none">Contact</a>
                </div>
                <a class="header-login">Login</a>
            </div>
        </header>


        <h2>What's your GOOSE idea?</h2>
        <h3 id="end-text" class="center-text">Let's chat and see how we can help</h3>

        <section class="end-blocks">
            <div id="telegram"> <img src="img/plane.png" alt="monkeytail" height="52" width="52">
                <p><b>telegram</b> @superdao_team</p>
            </div>
            <div id="email"> <img src="img/monkeytail.png" alt="monkeytail" height="52" width="52">
                <p><b>email</b> hello@superdao.co</p>
            </div>
        </section>

        <form class="form section-border contact-form">
            <h2>Send a post Goose</h2>
            <input placeholder="  Your email" type="email" name="email" required class="subscribe-field">
            <input placeholder="  Your name" name="name" required class="subscribe-field">
            <textarea rows="6" placeholder="  Your message" name="message" required class="message"></textarea>
            <select class="subscribe-field">
                <option value="" disabled selected hidden>Color of your Goose</option>
                <option value="optie 1">Red</option>
                <option value="optie 2">white</option>
                <option value="optie 3">blue</option>
                <option value="optie 4">black</option>
            </select><br>
            <button type="submit" id="subscribe-button">send</button>
        </form>
    </section>

    <footer>
        <div></div>
        <div></div>
        <div class="footer-box">
            <a>about</a>
            <a>jobs</a>
            <a>legal</a>
        </div>
        <div class="footer-pictures">
            <div id="twitter"> <img src="img/twitter-brands-solid.png" alt="twitter"> </div>
            <div id="paperplane"> <img src="img/paper-plane-solid.png" alt="paperplane"> </div>
            <div id="youtube"> <img src="img/youtube-brands-solid.png" alt="youtube"> </div>
            <div id="discord"> <img src="img/discord-brands-solid.png" alt="discord"> </div>
        </div>
    </footer>

</body>



</html>
